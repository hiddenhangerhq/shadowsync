<main>
  <h1>Edit Listing</h1>
  <label for="title">Title</label><input id="title" name="title" value="Nike Polo">
  <label for="desc">Description</label><textarea id="desc" name="description">Great shirt</textarea>
  <label for="op">Original Price</label><input id="op" name="original_price" value="60">
  <label for="lp">Listing Price</label><input id="lp" name="listing_price" value="25">
  <label for="qty">Quantity</label><input id="qty" name="quantity" value="1">
  <label for="avail">Availability</label>
  <select id="avail" name="availability"><option value="available">For Sale</option><option value="not_for_sale">Not For Sale</option></select>
  <button type="button">Update</button>
</main>
